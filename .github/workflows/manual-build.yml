name: Manual Build TurboACC

on:
  workflow_dispatch:    # 这行必须正确
    inputs:
      package_type:
        description: 'Package type'
        required: true
        default: 'apk'
        type: choice
        options:
        - apk
        - ipk
      target_arch:
        description: 'Target architecture'
        required: true
        default: 'x86_64'
        type: choice
        options:
        - x86_64
        - aarch64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Info
      run: |
        echo "Building ${{ inputs.package_type }} for ${{ inputs.target_arch }}"
        echo "This is a test build"
        
    - name: Create test artifact
      run: |
        mkdir -p artifacts
        echo "TurboACC ${{ inputs.package_type }} build for ${{ inputs.target_arch }}" > artifacts/README.txt
        date > artifacts/build_time.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: turboacc-${{ inputs.package_type }}-${{ inputs.target_arch }}
        path: artifacts/*
