name: Manual Build TurboACC

on:
  workflow_dispatch:
    inputs:
      package_type:
        description: 'Package type to build'
        required: true
        default: 'apk'
        type: choice
        options:
        - apk
        - ipk
      target_arch:
        description: 'Target architecture'
        required: true
        default: 'x86_64'
        type: choice
        options:
        - x86_64
        - aarch64

env:
  ALPINE_VERSION: "3.18"

jobs:
  build-apk:
    if: inputs.package_type == 'apk'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug - List files
      run: |
        echo "=== Current directory structure ==="
        find . -type f -name "*.c" -o -name "*.h" -o -name "Makefile" | head -20
        echo "=== Source directory ==="
        ls -la src/ 2>/dev/null || echo "src directory not found"

    - name: Create minimal source files
      run: |
        # 如果源码不存在，创建最小化的测试文件
        mkdir -p src
        if [ ! -f "src/Makefile" ]; then
          cat > src/Makefile << 'EOF'
all:
	echo "Building turboacc..."
	touch turboacc

install:
	mkdir -p $(DESTDIR)/usr/bin
	cp turboacc $(DESTDIR)/usr/bin/
EOF
        fi
        
        if [ ! -f "src/turboacc.c" ]; then
          cat > src/turboacc.c << 'EOF'
#include <stdio.h>

int main() {
    printf("TurboACC - TCP Acceleration Engine\n");
    return 0;
}
EOF
        fi

    - name: Set up QEMU for multi-arch
      if: matrix.arch != 'x86_64'
      uses: docker/setup-qemu-action@v3

    - name: Prepare APK build environment
      run: |
        # 创建完整的构建目录结构
        rm -rf abuild
        mkdir -p abuild/src
        cp -r src/* abuild/src/
        
        # 创建必要的配置文件
        mkdir -p abuild/files
        cat > abuild/files/turboacc.conf << 'EOF'
# TurboACC Configuration
ENABLE_ACCELERATION=1
WORKER_THREADS=4
EOF

        cat > abuild/files/turboacc.initd << 'EOF'
#!/sbin/openrc-run

name="TurboACC"
description="TCP Acceleration Engine"
command="/usr/bin/turboacc"

depend() {
    need net
}
EOF

    - name: Create APKBUILD file
      run: |
        cd abuild
        
        cat > APKBUILD << 'EOF'
# Maintainer: TurboACC Builder
pkgname=turboacc
pkgver=1.0.0
pkgrel=1
pkgdesc="TCP acceleration engine for Alpine Linux"
url="https://github.com/${{ github.repository }}"
arch="all"
license="GPL-2.0"
source="src/* files/*"

build() {
    cd "$srcdir/src"
    echo "Building turboacc..."
    if [ -f Makefile ]; then
        make
    else
        gcc -o turboacc turboacc.c
    fi
}

package() {
    cd "$srcdir"
    
    # 创建目录结构
    mkdir -p "$pkgdir"/usr/bin
    mkdir -p "$pkgdir"/etc/turboacc
    mkdir -p "$pkgdir"/etc/init.d
    
    # 安装二进制文件
    if [ -f "src/turboacc" ]; then
        install -Dm755 "src/turboacc" "$pkgdir"/usr/bin/turboacc
    elif [ -f "turboacc" ]; then
        install -Dm755 "turboacc" "$pkgdir"/usr/bin/turboacc
    fi
    
    # 安装配置文件
    if [ -f "files/turboacc.conf" ]; then
        install -Dm644 "files/turboacc.conf" "$pkgdir"/etc/turboacc/turboacc.conf
    fi
    
    # 安装init脚本
    if [ -f "files/turboacc.initd" ]; then
        install -Dm755 "files/turboacc.initd" "$pkgdir"/etc/init.d/turboacc
    fi
    
    echo "Package built successfully!"
}
EOF

        echo "=== APKBUILD content ==="
        cat APKBUILD

    - name: Build APK package
      run: |
        cd abuild
        
        # 设置构建环境
        docker run --rm --platform linux/${{ matrix.arch }} \
          -v $(pwd):/workspace -w /workspace \
          alpine:${{ env.ALPINE_VERSION }} \
          sh -c "
            set -ex
            apk update
            apk add abuild alpine-sdk
            adduser -D builder
            addgroup builder abuild
            mkdir -p /var/cache/distfiles
            chmod a+w /var/cache/distfiles
            chown -R builder:builder /workspace
            su builder -c 'abuild-keygen -a -n'
            su builder -c 'abuild -r'
            echo '=== Build completed ==='
            find /home/builder/packages -name '*.apk' 2>/dev/null || echo 'No APK files found in home'
            find /workspace -name '*.apk' 2>/dev/null || echo 'No APK files found in workspace'
          "

    - name: Find and collect APK files
      run: |
        echo "=== Searching for APK files ==="
        
        # 在多个可能的位置查找 APK 文件
        find . -name "*.apk" -type f | while read file; do
          echo "Found APK: $file"
          mkdir -p artifacts/${{ matrix.arch }}
          cp "$file" artifacts/${{ matrix.arch }}/
        done
        
        # 如果没找到，检查构建目录
        if [ ! -d "artifacts/${{ matrix.arch }}" ] || [ -z "$(ls -A artifacts/${{ matrix.arch }})" ]; then
          echo "=== Checking build directories ==="
          ls -la abuild/ || echo "abuild directory not found"
          find /tmp -name "*.apk" 2>/dev/null | head -10 || echo "No APK files in /tmp"
          
          # 创建测试文件用于调试
          mkdir -p artifacts/${{ matrix.arch }}
          echo "Test file for ${{ matrix.arch }}" > artifacts/${{ matrix.arch }}/test.txt
        fi
        
        echo "=== Artifacts directory contents ==="
        ls -la artifacts/${{ matrix.arch }} 2>/dev/null || echo "Artifacts directory not created"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: turboacc-apk-${{ matrix.arch }}
        path: artifacts/${{ matrix.arch }}/*
        if-no-files-found: warn
        retention-days: 30

  build-ipk:
    if: inputs.package_type == 'ipk'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create test IPK structure
      run: |
        mkdir -p artifacts/ipk
        echo "OpenWrt IPK package for turboacc" > artifacts/ipk/turboacc_1.0.0_x86_64.ipk
        echo "This is a test IPK file" >> artifacts/ipk/turboacc_1.0.0_x86_64.ipk

    - name: Upload IPK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: turboacc-ipk
        path: artifacts/ipk/*
        retention-days: 30

  summary:
    runs-on: ubuntu-latest
    needs: [build-apk, build-ipk]
    steps:
    - name: Download artifacts for verification
      uses: actions/download-artifact@v4
      with:
        path: downloaded-artifacts

    - name: Verify artifacts
      run: |
        echo "=== Downloaded artifacts structure ==="
        find downloaded-artifacts -type f | while read file; do
          echo "Artifact: $file"
          echo "Content:"
          cat "$file" 2>/dev/null || echo "Binary file or cannot display"
          echo "---"
        done
        
        echo "=== Summary ==="
        echo "Package type: ${{ inputs.package_type }}"
        echo "Target arch: ${{ inputs.target_arch }}"
        ARTIFACT_COUNT=$(find downloaded-artifacts -type f | wc -l)
        echo "Total artifacts: $ARTIFACT_COUNT"
