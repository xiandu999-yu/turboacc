name: Build TurboACC for OpenWrt SNAPSHOT

on:
  workflow_dispatch:
    inputs:
      turboacc_type:
        description: 'TurboACC type'
        required: true
        default: 'with-sfe'
        type: choice
        options:
        - 'with-sfe'
        - 'no-sfe'
      target_arch:
        description: 'Target architecture'
        required: true
        default: 'x86_64'
        type: choice
        options:
        - x86_64
        - aarch64
        - arm_cortex-a7

env:
  OPENWRT_BRANCH: "master"  # SNAPSHOT 对应 master 分支

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout OpenWrt SNAPSHOT
      uses: actions/checkout@v4
      with:
        repository: openwrt/openwrt
        ref: ${{ env.OPENWRT_BRANCH }}
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-pip python3-selinux \
          rsync unzip zlib1g-dev file wget

    - name: Setup build environment
      run: |
        # 更新 feeds (SNAPSHOT 版本需要)
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Add TurboACC to OpenWrt SNAPSHOT
      run: |
        echo "添加 TurboACC 到 OpenWrt SNAPSHOT..."
        
        if [ "${{ inputs.turboacc_type }}" = "with-sfe" ]; then
          echo "使用带 SFE 的版本"
          curl -sSL https://raw.githubusercontent.com/chemnozhijin/turboacc/luci/add_turboacc.sh -o add_turboacc.sh
        else
          echo "使用不带 SFE 的版本" 
          curl -sSL https://raw.githubusercontent.com/chemnozhijin/turboacc/luci/add_turboacc_nosfe.sh -o add_turboacc.sh
        fi
        
        chmod +x add_turboacc.sh
        ./add_turboacc.sh

    - name: Configure for APK packages
      run: |
        # SNAPSHOT 版本默认使用 APK 格式，确保配置正确
        echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-fullcone=y" >> .config
        
        if [ "${{ inputs.turboacc_type }}" = "with-sfe" ]; then
          echo "CONFIG_PACKAGE_kmod-shortcut-fe=y" >> .config
          echo "CONFIG_PACKAGE_kmod-shortcut-fe-cm=y" >> .config
        fi
        
        # 设置目标架构
        echo "CONFIG_TARGET_${{ inputs.target_arch }}=y" >> .config
        make defconfig

    - name: Build TurboACC packages
      run: |
        # 下载预编译组件
        make -j$(nproc) download
        
        # 只编译 TurboACC 相关包（节省时间）
        echo "开始编译 TurboACC 相关包..."
        make package/luci-app-turboacc/compile V=s
        make package/nft-fullcone/compile V=s
        
        if [ "${{ inputs.turboacc_type }}" = "with-sfe" ]; then
          make package/shortcut-fe/compile V=s
        fi

    - name: Collect APK packages
      run: |
        echo "收集生成的 APK 包..."
        mkdir -p artifacts
        
        # 查找所有 turboacc 相关的 APK 包
        find bin -name "*.apk" | grep -E "(turboacc|fullcone|shortcut)" | while read file; do
          echo "找到: $file"
          cp "$file" artifacts/
        done
        
        # 显示收集到的文件
        echo "=== 生成的 APK 包 ==="
        ls -la artifacts/ || echo "没有找到 APK 文件"

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: turboacc-${{ inputs.target_arch }}-${{ inputs.turboacc_type }}
        path: artifacts/*.apk
        if-no-files-found: warn
        retention-days: 30
