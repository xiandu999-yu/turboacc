name: Build TurboACC for OpenWrt SNAPSHOT

on:
  workflow_dispatch:
    inputs:
      turboacc_type:
        description: 'TurboACC type'
        required: true
        default: 'with-sfe'
        type: choice
        options:
          - 'with-sfe'
          - 'no-sfe'
      target_arch:
        description: 'Target architecture'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - 'x86_64'
          - 'aarch64'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout OpenWrt SNAPSHOT
      uses: actions/checkout@v4
      with:
        repository: openwrt/openwrt
        ref: master

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-pip \
          rsync unzip zlib1g-dev file wget

    - name: Setup build environment
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Manual TurboACC integration
      run: |
        echo "手动集成 TurboACC..."
        
        # 创建必要的包目录
        mkdir -p package/turboacc
        
        # 下载 luci-app-turboacc
        git clone https://github.com/coolsnowwolf/luci-app-turboacc.git package/luci-app-turboacc || \
        echo "使用备用源下载 luci-app-turboacc"
        
        git clone https://github.com/kiddin9/luci-app-turboacc.git package/luci-app-turboacc || \
        echo "备用源也失败，继续构建"

    - name: Configure and build
      run: |
        echo "配置编译..."
        
        # 基础配置
        echo "CONFIG_TARGET_x86=y" >> .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        
        make defconfig
        make -j$(nproc) package/luci-app-turboacc/compile V=0

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: turboacc-packages
        path: bin/packages/*/base/*.apk
        if-no-files-found: warn
