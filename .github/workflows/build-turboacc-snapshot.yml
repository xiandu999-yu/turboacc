name: Build TurboACC

on:
  workflow_dispatch:
    inputs:
      turboacc_type:
        description: 'TurboACC type'
        required: true
        default: 'with-sfe'
        type: choice
        options:
          - 'with-sfe'
          - 'no-sfe'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: master

      - name: Setup environment
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add TurboACC
        run: |
          git clone https://github.com/kiddin9/luci-app-turboacc.git package/luci-app-turboacc

      - name: Configure and build
        run: |
          echo "CONFIG_TARGET_x86_64=y" > .config
          echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
          make defconfig
          make -j1 V=s package/luci-app-turboacc/compile

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: turboacc-packages
          path: bin/packages/*/base/*.apk
          if-no-files-found: warn
